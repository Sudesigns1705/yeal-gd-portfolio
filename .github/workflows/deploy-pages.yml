name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout portfolio
        uses: actions/checkout@v4
      - name: Validate portfolio JavaScript
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const page = fs.readFileSync('index.html', 'utf8');
          const matches = [...page.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/g)];
          if (!matches.length) throw new Error('No inline JavaScript found');
          for (const [, source] of matches) new vm.Script(source);
          console.log('Validated', matches.length, 'inline script(s)');
          NODE
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
